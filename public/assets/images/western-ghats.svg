<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#FCEFD2"/>
      <stop offset="100%" stop-color="#F6E2B8"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A4BFA4"/>
      <stop offset="100%" stop-color="#739773"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F9158"/>
      <stop offset="100%" stop-color="#4B6E36"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7A942"/>
      <stop offset="50%" stop-color="#B88220"/>
      <stop offset="100%" stop-color="#6E4C11"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="600" height="340" fill="url(#skyGrad)"/>

  <!-- Morning Sun -->
  <circle cx="300" cy="110" r="50" fill="#FFF3CD" opacity="0.8"/>
  <circle cx="300" cy="110" r="75" fill="#FFEAA8" opacity="0.3"/>

  <!-- Distant Ghats Hills -->
  <path d="M0 190 Q120 130 240 170 T480 150 Q540 160 600 180 L600 340 L0 340 Z" fill="url(#hillFar)" opacity="0.6"/>

  <!-- Mid-range Thirthahalli Forest Hills -->
  <path d="M0 220 Q160 160 320 210 Q450 170 600 230 L600 340 L0 340 Z" fill="url(#hillMid)" opacity="0.85"/>

  <!-- Foreground Apiary & Flora Meadow -->
  <path d="M0 270 Q140 240 290 265 Q440 235 600 275 L600 340 L0 340 Z" fill="url(#hillFront)"/>

  <!-- Traditional Bee Boxes / Apiary in farm -->
  <g transform="translate(180, 245)">
    <!-- Bee Box 1 -->
    <rect x="0" y="0" width="34" height="26" rx="2" fill="#FAF5E8" stroke="#754E1A" stroke-width="1.5"/>
    <rect x="-3" y="-5" width="40" height="6" rx="1.5" fill="#C58F33"/>
    <rect x="12" y="18" width="10" height="3" rx="1" fill="#4B310F"/>
    <line x1="6" y1="26" x2="6" y2="34" stroke="#754E1A" stroke-width="2"/>
    <line x1="28" y1="26" x2="28" y2="34" stroke="#754E1A" stroke-width="2"/>
  </g>

  <g transform="translate(240, 240)">
    <!-- Bee Box 2 -->
    <rect x="0" y="0" width="34" height="26" rx="2" fill="#FAF5E8" stroke="#754E1A" stroke-width="1.5"/>
    <rect x="-3" y="-5" width="40" height="6" rx="1.5" fill="#C58F33"/>
    <rect x="12" y="18" width="10" height="3" rx="1" fill="#4B310F"/>
    <line x1="6" y1="26" x2="6" y2="34" stroke="#754E1A" stroke-width="2"/>
    <line x1="28" y1="26" x2="28" y2="34" stroke="#754E1A" stroke-width="2"/>
  </g>

  <g transform="translate(390, 250)">
    <!-- Bee Box 3 -->
    <rect x="0" y="0" width="34" height="26" rx="2" fill="#FAF5E8" stroke="#754E1A" stroke-width="1.5"/>
    <rect x="-3" y="-5" width="40" height="6" rx="1.5" fill="#C58F33"/>
    <rect x="12" y="18" width="10" height="3" rx="1" fill="#4B310F"/>
    <line x1="6" y1="26" x2="6" y2="34" stroke="#754E1A" stroke-width="2"/>
    <line x1="28" y1="26" x2="28" y2="34" stroke="#754E1A" stroke-width="2"/>
  </g>

  <!-- Wildflowers popping up in foreground -->
  <g fill="#FFF5C2">
    <circle cx="80" cy="290" r="4"/>
    <circle cx="110" cy="305" r="5"/>
    <circle cx="340" cy="295" r="4.5"/>
    <circle cx="480" cy="310" r="5"/>
    <circle cx="530" cy="295" r="4"/>
  </g>

  <!-- Label Banner -->
  <rect x="170" y="20" width="260" height="32" rx="16" fill="#FFFDF8" stroke="#D3A23D" stroke-width="1.5" opacity="0.95"/>
  <text x="300" y="41" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#422507" text-anchor="middle" letter-spacing="1">
    KOTIKOPPA &bull; ARAGA &bull; THIRTHAHALLI
  </text>
</svg>
