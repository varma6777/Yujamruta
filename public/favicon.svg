<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA8"/>
      <stop offset="35%" stop-color="#E5AF36"/>
      <stop offset="70%" stop-color="#C58B1B"/>
      <stop offset="100%" stop-color="#8C5C0B"/>
    </linearGradient>
    <linearGradient id="dropGold" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="50%" stop-color="#F5B82A"/>
      <stop offset="100%" stop-color="#B2740A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon: Lotus Yogi Emblem -->
  <g transform="translate(6, 6)">
    <!-- Base Lotus Petals (Back Left & Right) -->
    <path d="M28 46 C16 42 6 34 8 20 C14 26 22 35 28 46 Z" fill="url(#goldGradient)" opacity="0.85"/>
    <path d="M28 46 C40 42 50 34 48 20 C42 26 34 35 28 46 Z" fill="url(#goldGradient)" opacity="0.85"/>
    
    <!-- Mid Lotus Petals -->
    <path d="M28 46 C21 38 15 26 20 15 C24 23 26 33 28 46 Z" fill="url(#goldGradient)"/>
    <path d="M28 46 C35 38 41 26 36 15 C32 23 30 33 28 46 Z" fill="url(#goldGradient)"/>

    <!-- Center Yogi Head & Heart Honey Drop -->
    <circle cx="28" cy="12" r="4.5" fill="url(#dropGold)" filter="url(#softGlow)"/>
    <!-- Center droplet body -->
    <path d="M28 17 C28 17 33 26 33 32 C33 36 30.5 39 28 39 C25.5 39 23 36 23 32 C23 26 28 17 28 17 Z" fill="url(#dropGold)"/>
    
    <!-- Subtle Base Stand -->
    <path d="M18 47 Q28 50 38 47" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(64, 15)">
    <text x="0" y="24" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="url(#goldGradient)" letter-spacing="1.2">
      YUJAMRUTHA
    </text>
    <text x="1" y="40" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="400" fill="#E2C992" letter-spacing="0.8" opacity="0.95">
      Where Nature Meets Wellness
    </text>
  </g>
</svg>
